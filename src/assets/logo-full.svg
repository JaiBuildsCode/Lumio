<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="720" height="200" role="img" aria-labelledby="titleDescFull">
  <title id="titleDescFull">Lumio — logo</title>
  <desc>Icon and wordmark for Lumio — simple, modern, professional.</desc>
  <defs>
    <linearGradient id="lg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Icon (left) -->
  <g transform="translate(8,6)">
